<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(255, 255, 255, 0.06);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.5);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--glass-border);
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--transition);
            width: 25%;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-item.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        .tab-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

        .app-container {
            flex: 1;
            position: relative;
            padding: 20px;
            padding-bottom: 90px;
            overflow-y: auto;
        }

        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }

        .section-title { font-size: 18px; color: var(--text-dim); margin: 25px 0 15px; display: flex; justify-content: space-between; align-items: center; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
        }
        .card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .card img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .card .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .subtitle { font-size: 12px; color: var(--text-dim); }

        #player-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; box-sizing: border-box;
        }
        #player-screen.active { display: flex; }

        .player-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1614613535308-eb5fbd33267c?q=80&w=1000') center/cover;
            filter: blur(50px) brightness(0.4); z-index: -1; transform: scale(1.1);
        }

        .player-cover {
            width: 280px; height: 280px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); margin-bottom: 40px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .player-info { text-align: center; margin-bottom: 40px; }
        .player-info h2 { font-size: 24px; margin: 0; }
        .player-info p { color: var(--text-dim); margin: 5px 0 0; }

        .progress-container { width: 80%; display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); border-radius: 2px; }
        .time { font-size: 11px; color: var(--text-dim); min-width: 35px; }

        .player-controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
        .ctrl-btn { background: none; border: none; color: white; cursor: pointer; transition: var(--transition); fill: white; }
        .ctrl-btn:active { transform: scale(0.9); opacity: 0.7; }
        .play-btn { width: 70px; height: 70px; background: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--bg-dark); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .close-player { position: absolute; top: 40px; left: 20px; background: none; border: none; color: white; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="screen-home" class="screen active">
            <h1>Для вас</h1>
            <div class="section-title">Популярное <span>Все</span></div>
            <div class="grid">
                <div class="card" onclick="openPlayer(0)">
                    <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd33267c?w=300">
                    <div class="title">Night City Drift</div>
                    <div class="subtitle">Synthwave</div>
                </div>
                <div class="card" onclick="openPlayer(1)">
                    <img src="https://images.unsplash.com/photo-1459749411177-0436759187ed?w=300">
                    <div class="title">Deep Ocean</div>
                    <div class="subtitle">Ambient</div>
                </div>
                <div class="card" onclick="openPlayer(2)">
                    <img src="https://images.unsplash.com/photo-1493225255756-1ca4b56575b1?w=300">
                    <div class="title">Neon Lights</div>
                    <div class="subtitle">Electro</div>
                </div>
            </div>
        </div>

        <div id="screen-search" class="screen">
            <h1>Поиск</h1>
            <input type="text" placeholder="Артисты, треки..." style="width: 100%; padding: 15px; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 15px; color: white; box-sizing: border-box; outline: none;">
        </div>

        <div id="screen-lib" class="screen">
            <h1>Моя музыка</h1>
            <div class="section-title">Любимое</div>
            <div class="grid"><div class="card"> <div class="title">Пусто</div></div></div>
        </div>

        <div id="screen-profile" class="screen">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 100px; height: 100px; background: var(--accent-gradient); border-radius: 50%; margin: 0 auto 15px;"></div>
                <h2>Пользователь</h2>
                <p>Premium Account</p>
            </div>
        </div>
    </div>

    <div id="player-screen">
        <div class="player-bg" id="player-bg"></div>
        <button class="close-player" onclick="closePlayer()">✕</button>
        <img src="" class="player-cover" id="p-cover">
        <div class="player-info">
            <h2 id="p-title">Song Name</h2>
            <p id="p-artist">Artist Name</p>
        </div>
        <div class="progress-container">
            <div class="time" id="time-current">0:00</div>
            <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="time" id="time-total">0:00</div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn" onclick="prev()">
                <svg viewBox="0 0 24 24" width="30"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn play-btn" id="mainPlayBtn">
                <svg viewBox="0 0 24 24" width="30" height="30" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" onclick="next()">
                <svg viewBox="0 0 24 24" width="30"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
            </button>
        </div>
        <audio id="main-audio"></audio>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('screen-home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Главная</span>
        </div>
        <div class="tab-item" onclick="switchTab('screen-search', this)">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3 6.41 5.91 3.5 9.5 3.5 13.09 6.41 16 9.5 16 12.59 15.71 13.73l.27.27v.79l5.48-5.47z"/></svg>
            <span>Поиск</span>
        </div>
        <div class="tab-item" onclick="switchTab('screen-lib', this)">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Библиотека</span>
        </div>
        <div class="tab-item" onclick="switchTab('screen-profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const songs = [
            { title: 'Night City Drift', artist: 'Synthwave', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', cover: 'https://images.unsplash.com/photo-1614613535308-eb5fbd33267c?w=300' },
            { title: 'Deep Ocean', artist: 'Ambient', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', cover: 'https://images.unsplash.com/photo-1459749411177-0436759187ed?w=300' },
            { title: 'Neon Lights', artist: 'Electro', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', cover: 'https://images.unsplash.com/photo-1493225255756-1ca4b56575b1?w=300' }
        ];

        let current = 0;
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('mainPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progress-fill');

        function switchTab(screenId, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function openPlayer(index) {
            current = index;
            const song = songs[current];
            document.getElementById('p-title').innerText = song.title;
            document.getElementById('p-artist').innerText = song.artist;
            document.getElementById('p-cover').src = song.cover;
            document.getElementById('player-bg').style.backgroundImage = `url(${song.cover})`;
            audio.src = song.url;
            document.getElementById('player-screen').classList.add('active');
            playSong();
        }

        function closePlayer() {
            document.getElementById('player-screen').classList.remove('active');
            audio.pause();
        }

        function playSong() {
            audio.play();
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function pauseSong() {
            audio.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        playBtn.onclick = () => {
            if (audio.paused) playSong(); else pauseSong();
        };

        function next() { current = (current + 1) % songs.length; openPlayer(current); }
        function prev() { current = (current - 1 + songs.length) % songs.length; openPlayer(current); }

        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            document.getElementById('time-current').innerText = formatTime(audio.currentTime);
            document.getElementById('time-total').innerText = formatTime(audio.duration || 0);
        };

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }
    </script>
</body>
</html>
