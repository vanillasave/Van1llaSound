<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Player</title>
    <!-- Подключаем API Телеграма для работы Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: var(--tg-theme-bg-color, #1c1c1c); 
            color: var(--tg-theme-text-color, #ffffff); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .player-card { 
            text-align: center; 
            width: 90%; 
            max-width: 350px; 
            padding: 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .cover { 
            width: 220px; 
            height: 220px; 
            background: linear-gradient(45deg, #ff00cc, #3333ff); 
            border-radius: 20px; 
            margin: 0 auto 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            transition: transform 0.3s ease;
        }
        .playing .cover { transform: scale(1.05); }
        h2 { margin: 10px 0 5px; font-size: 22px; }
        p { opacity: 0.6; margin-bottom: 30px; }
        .controls { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            align-items: center; 
        }
        button { 
            background: var(--tg-theme-button-color, #2481cc); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; 
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 24px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        #playBtn { width: 80px; height: 80px; font-size: 30px; }
    </style>
</head>
<body id="body">

    <div class="player-card" id="card">
        <div class="cover"></div>
        <h2 id="title">Загрузка...</h2>
        <p id="artist">Твой вайб</p>
        <div class="controls">
            <button onclick="prev()">⏮</button>
            <button id="playBtn" onclick="togglePlay()">▶️</button>
            <button onclick="next()">⏭</button>
        </div>
        <audio id="audio"></audio>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем приложение на весь экран

        // СПИСОК ТРЕКОВ (Сюда будешь добавлять свои ссылки в будущем)
        const songs = [
            { name: "Vibe Track 1", artist: "Artist 1", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { name: "Vibe Track 2", artist: "Artist 2", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { name: "Vibe Track 3", artist: "Artist 3", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
        ];

        let current = 0;
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const card = document.getElementById('card');

        function loadSong() {
            title.innerText = songs[current].name;
            artist.innerText = songs[current].artist;
            audio.src = songs[current].url;
        }

        function togglePlay() {
            if (audio.paused) { 
                audio.play(); 
                playBtn.innerText = "⏸"; 
                card.classList.add('playing');
            } else { 
                audio.pause(); 
                playBtn.innerText = "▶️"; 
                card.classList.remove('playing');
            }
        }

        function next() { 
            current = (current + 1) % songs.length; 
            loadSong(); 
            audio.play(); 
            playBtn.innerText = "⏸"; 
            card.classList.add('playing');
        }

        function prev() { 
            current = (current - 1 + songs.length) % songs.length; 
            loadSong(); 
            audio.play(); 
            playBtn.innerText = "⏸"; 
            card.classList.add('playing');
        }

        loadSong();
    </script>
</body>
</html>
